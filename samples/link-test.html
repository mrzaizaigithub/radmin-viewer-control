<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadminAuto link test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin: 10px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 6px; box-sizing: border-box; }
  code { display: block; word-break: break-all; background: #f2f2f2; padding: 8px; margin: 12px 0; }
  a.button { display: inline-block; padding: 8px 16px; background: #0b5ed7; color: #fff; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
<h1>Mở Radmin bằng link</h1>
<p>Cần chạy <b>RadminAuto.exe --register</b> một lần trên máy này trước.</p>

<label>Host / IP <input type="text" id="host" value="192.168.11.242"></label>
<label>Port <input type="text" id="port" value="4899"></label>
<label>User <input type="text" id="user" value="remote"></label>
<label>Mật khẩu <input type="password" id="pass" value="remote"></label>
<label><input type="checkbox" id="fullscreen"> Toàn màn hình</label>
<label><input type="checkbox" id="viewonly"> Chỉ xem</label>

<code id="link"></code>
<a class="button" id="open" href="#">Mở Radmin</a>

<script>
  function build() {
    const v = id => encodeURIComponent(document.getElementById(id).value);
    let url = "radminauto://connect?host=" + v("host") + "&port=" + v("port") +
              "&user=" + v("user") + "&pass=" + v("pass");
    if (document.getElementById("fullscreen").checked) url += "&fullscreen=1";
    if (document.getElementById("viewonly").checked) url += "&viewonly=1";
    document.getElementById("link").textContent = url;
    document.getElementById("open").href = url;
  }
  document.querySelectorAll("input").forEach(i => i.addEventListener("input", build));
  build();
</script>
</body>
</html>
